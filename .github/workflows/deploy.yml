# 每天抓一次价格、重算指数、部署到 GitHub Pages。
#
# 顺序上有两处刻意的设计：
#
#   1. 部署排在数据提交之前。数据提交要 git push，是唯一可能因远端变化被拒的
#      步骤（比如刚好有人推了代码，非快进）。它一旦失败会中断整个任务，导致
#      构建成功却不部署——线上就永远停在旧版本。所以：先部署，再提交，且提交
#      失败不影响本次结果。
#   2. 抓取失败不中断。build_teci.py 在没有原始快照时会改用已提交的
#      data/teci_snapshot.csv 重建，页面顶部会如实显示"数据已 N 天未更新"。
#
# 首次使用需要在仓库 Settings → Pages → Source 选择 "GitHub Actions"
# （不是 "Deploy from a branch"）。

name: 每日更新并部署

on:
  schedule:
    # 北京时间 09:10（UTC 01:10）主更新。
    # GitHub 定时任务可能延迟几分钟到几十分钟，偶尔会漏跑。
    - cron: "10 1 * * *"
    # 北京时间 21:10（UTC 13:10）兜底补跑。
    # 早上那次失败或延误时，这次会补上；数据没变化时提交步骤会自动跳过。
    - cron: "10 13 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # 把数据提交回去，历史序列才能累积
  pages: write
  id-token: write

concurrency:
  group: teci-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取最新价格
        # 失败也继续：构建会退回已提交的截面数据
        continue-on-error: true
        run: python scripts/fetch_models.py

      - name: 计算指数并生成网页
        run: python scripts/build_teci.py

      - name: 校验（不通过就不部署）
        run: |
          node scripts/test_site.js
          python scripts/check_contrast.py

      # ↓↓↓ 先部署：这一步必须跑得到 ↓↓↓
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # ↓↓↓ 再记账：失败也不影响已完成的部署 ↓↓↓
      - name: 提交数据变化
        continue-on-error: true
        run: |
          git config user.name "teci-bot"
          git config user.email "teci-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: $(date -u +%F) 自动更新"
            git push
          fi
